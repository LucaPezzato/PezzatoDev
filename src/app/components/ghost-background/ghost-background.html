<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 print:hidden" aria-hidden="true">
  @for (item of items; track item.id) {
    <!-- Outer Container: Handles Parallax + Mouse Repulsion -->
    <div
      class="absolute transition-transform duration-300 ease-out will-change-transform"
      [style.left]="item.left"
      [style.top]="item.top"
      [style.width.px]="item.size"
      [style.height.px]="item.size"
      [style.opacity]="item.opacity"
      [style.color]="item.color"
      [style.transform]="getItemTransform(item)"
    >
      <!-- Inner Container: Handles Ambient Floating / Fast Flying Keyframe Animations -->
      <div
        class="w-full h-full bg-item-container"
        [class]="item.animClass"
        [style.animation-delay]="item.animDelay"
      >
        @if (item.type === 'ghost') {
          @switch (item.variant) {
            @case (1) {
              <!-- Variant 1: Cute Boo Ghost -->
              <svg viewBox="0 0 64 64" fill="none" class="w-full h-full filter drop-shadow-[0_0_12px_currentColor]">
                <path
                  d="M32 6C19.85 6 10 15.85 10 28V48C10 51.5 13 53.5 16 51.5C19 49.5 22 49.5 25 51.5C28 53.5 31 53.5 34 51.5C37 49.5 40 49.5 43 51.5C46 53.5 49 51.5 49 48V28C49 15.85 39.15 6 32 6Z"
                  fill="currentColor"
                />
                <circle cx="24" cy="25" r="3.5" fill="#282a36" />
                <circle cx="40" cy="25" r="3.5" fill="#282a36" />
                <circle cx="25.2" cy="23.8" r="1.2" fill="#ffffff" />
                <circle cx="41.2" cy="23.8" r="1.2" fill="#ffffff" />
                <ellipse cx="20" cy="29" rx="2.5" ry="1.5" fill="#ff79c6" opacity="0.6" />
                <ellipse cx="44" cy="29" rx="2.5" ry="1.5" fill="#ff79c6" opacity="0.6" />
                <ellipse cx="32" cy="31" rx="2" ry="3" fill="#282a36" />
              </svg>
            }
            @case (2) {
              <!-- Variant 2: Floating Spirit with Tail -->
              <svg viewBox="0 0 64 64" fill="none" class="w-full h-full filter drop-shadow-[0_0_12px_currentColor]">
                <path
                  d="M32 6C20 6 12 15 12 27C12 37 17 44 22 48C25 50.5 24 55 20 58C28 57 35 52 38 46C44 40 48 34 48 27C48 15 40 6 32 6Z"
                  fill="currentColor"
                />
                <circle cx="25" cy="24" r="3" fill="#282a36" />
                <circle cx="37" cy="24" r="3" fill="#282a36" />
                <circle cx="26" cy="23" r="1" fill="#ffffff" />
                <circle cx="38" cy="23" r="1" fill="#ffffff" />
                <path d="M27 30C29 32 33 32 35 30" stroke="#282a36" stroke-width="2" stroke-linecap="round" />
              </svg>
            }
            @case (3) {
              <!-- Variant 3: Little Waving Ghost -->
              <svg viewBox="0 0 64 64" fill="none" class="w-full h-full filter drop-shadow-[0_0_12px_currentColor]">
                <path
                  d="M32 6C20 6 12 15 12 26C8 28 6 32 8 35C10 37 13 36 14 33C14 44 18 52 22 50C26 48 28 53 32 50C36 47 38 52 42 50C46 48 50 33 50 33C51 36 54 37 56 35C58 32 56 28 52 26C52 15 44 6 32 6Z"
                  fill="currentColor"
                />
                <circle cx="24" cy="24" r="3.5" fill="#282a36" />
                <path d="M36 25L42 25" stroke="#282a36" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="25.2" cy="22.8" r="1.2" fill="#ffffff" />
                <path d="M28 30C30 33 34 33 36 30" stroke="#282a36" stroke-width="2" stroke-linecap="round" fill="none" />
              </svg>
            }
          }
        } @else if (item.type === 'bat') {
          @switch (item.variant) {
            @case (1) {
              <!-- Gothic Bat Variant 1 with Wide Curved Bat Ears & Inner Detail -->
              <svg viewBox="0 0 100 60" fill="none" class="w-full h-full filter drop-shadow-[0_0_10px_currentColor]">
                <!-- Left Flapping Wing -->
                <path
                  class="bat-wing-left"
                  d="M 50,30 C 40,14 26,4 2,12 C 10,22 15,36 22,34 C 27,45 34,42 38,36 C 42,46 47,40 50,30 Z"
                  fill="currentColor"
                />
                <!-- Right Flapping Wing -->
                <path
                  class="bat-wing-right"
                  d="M 50,30 C 60,14 74,4 98,12 C 90,22 85,36 78,34 C 73,45 66,42 62,36 C 58,46 53,40 50,30 Z"
                  fill="currentColor"
                />
                <!-- Head & Body -->
                <ellipse cx="50" cy="33" rx="7" ry="9" fill="currentColor" />

                <!-- Wide Triangular Bat Ears -->
                <path d="M 42,27 L 39,15 L 48,25 Z" fill="currentColor" />
                <path d="M 43,26 L 40,17 L 47,25 Z" fill="#ff79c6" opacity="0.8" />

                <path d="M 58,27 L 61,15 L 52,25 Z" fill="currentColor" />
                <path d="M 57,26 L 60,17 L 53,25 Z" fill="#ff79c6" opacity="0.8" />

                <!-- Eyes -->
                <circle cx="46.5" cy="30.5" r="1.5" fill="#282a36" />
                <circle cx="53.5" cy="30.5" r="1.5" fill="#282a36" />
                <circle cx="47" cy="30" r="0.6" fill="#ffffff" />
                <circle cx="54" cy="30" r="0.6" fill="#ffffff" />

                <!-- Fangs -->
                <polygon points="47,35 48,38 49,35" fill="#ffffff" />
                <polygon points="51,35 52,38 53,35" fill="#ffffff" />
              </svg>
            }
            @case (2) {
              <!-- Gothic Bat Variant 2 (Red Eyes) with Wide Bat Ears & Inner Red Detail -->
              <svg viewBox="0 0 100 60" fill="none" class="w-full h-full filter drop-shadow-[0_0_10px_currentColor]">
                <!-- Left Flapping Wing -->
                <path
                  class="bat-wing-left"
                  d="M 50,30 C 40,14 26,4 2,12 C 10,22 15,36 22,34 C 27,45 34,42 38,36 C 42,46 47,40 50,30 Z"
                  fill="currentColor"
                />
                <!-- Right Flapping Wing -->
                <path
                  class="bat-wing-right"
                  d="M 50,30 C 60,14 74,4 98,12 C 90,22 85,36 78,34 C 73,45 66,42 62,36 C 58,46 53,40 50,30 Z"
                  fill="currentColor"
                />
                <!-- Head & Body -->
                <ellipse cx="50" cy="33" rx="7" ry="9" fill="currentColor" />

                <!-- Wide Triangular Bat Ears -->
                <path d="M 42,27 L 39,15 L 48,25 Z" fill="currentColor" />
                <path d="M 43,26 L 40,17 L 47,25 Z" fill="#ff5555" opacity="0.8" />

                <path d="M 58,27 L 61,15 L 52,25 Z" fill="currentColor" />
                <path d="M 57,26 L 60,17 L 53,25 Z" fill="#ff5555" opacity="0.8" />

                <!-- Glowing Red Vampire Eyes -->
                <circle cx="46.5" cy="30" r="2" fill="#ff5555" />
                <circle cx="53.5" cy="30" r="2" fill="#ff5555" />

                <!-- Fangs -->
                <polygon points="47,34 48,37 49,34" fill="#ffffff" />
                <polygon points="51,34 52,37 53,34" fill="#ffffff" />
              </svg>
            }
          }
        }
      </div>
    </div>
  }
</div>
